@if (loading()) {
  <span>{{ 'shared.loading' | translate }}</span>
} @else if (error()) {
  <span>{{ 'shared.unknown' | translate }}</span>
} @else {
  @if (employeeId()) {
    <app-employee-name [employeeId]="employeeId()"></app-employee-name>
  } @else {
    <span>{{ 'shared.unknown' | translate }}</span>
  }
}
