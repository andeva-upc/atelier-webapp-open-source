
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Cliente</mat-label>
      <mat-select [ngModel]="selectedCustomerId" (ngModelChange)="onSelectionChange($event)" [disabled]="disabled">
        @for (reg of fleetStore.customerRegistrations(); track reg.id) {
          <mat-option [value]="reg.customerId">
            <app-customer-name [customerId]="reg.customerId"></app-customer-name>
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
