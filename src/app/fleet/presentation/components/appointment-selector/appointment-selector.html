
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Select Pending Appointment</mat-label>
      <mat-select [ngModel]="selectedAppointmentId" (ngModelChange)="onSelectionChange($event)" [disabled]="disabled">
        @if (fleetStore.appointments().length === 0) {
          <mat-option disabled>No pending appointments found</mat-option>
        }
        @for (appointment of fleetStore.appointments(); track appointment.id) {
          <mat-option [value]="appointment.id">
            {{ appointment.scheduledStart | date:'short' }} - {{ appointment.notes || 'No notes' }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
