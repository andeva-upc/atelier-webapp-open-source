<div class="dashboard-container">
  <div class="header">
    <h1>{{ 'billing.dashboard.title' | translate }}</h1>
  </div>
  
  <div class="content">
    <app-financial-kpi-cards [stats]="store.financialStats()"></app-financial-kpi-cards>
    
    <div class="charts-section">
      <app-income-expense-chart [stats]="store.financialStats()"></app-income-expense-chart>
    </div>

    <!-- PAGE-LEVEL VIEW TOGGLE -->
    <div class="view-toggle-container">
      <mat-button-toggle-group [value]="currentView()" (change)="currentView.set($event.value)" class="premium-toggle" hideSingleSelectionIndicator="true" [attr.data-active]="currentView()">
        <mat-button-toggle value="quotes">{{ 'billing.tabs.quotes' | translate }}</mat-button-toggle>
        <mat-button-toggle value="vouchers">{{ 'billing.tabs.vouchers' | translate }}</mat-button-toggle>
        <mat-button-toggle value="expenses">{{ 'billing.tabs.expenses' | translate }}</mat-button-toggle>
      </mat-button-toggle-group>
    </div>

    <!-- TRANSACTIONS CONTAINER -->
    <div class="transactions-section">
      @switch (currentView()) {
        @case ('quotes') {
          <app-quote-list [quotes]="store.branchQuotes()"></app-quote-list>
        }
        @case ('vouchers') {
          <app-income-list [incomes]="store.branchVouchers()" (openCheckout)="openCheckoutDialog()"></app-income-list>
        }
        @case ('expenses') {
          <app-expense-list></app-expense-list>
        }
      }
    </div>
  </div>
</div>
