<div class="table-container">
  <table mat-table [dataSource]="quotes" class="mat-elevation-z2" *ngIf="quotes.length > 0">
    
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Quote ID </th>
      <td mat-cell *matCellDef="let quote"> {{quote.id.substring(0, 8)}}... </td>
    </ng-container>

    <!-- Customer Name Column -->
    <ng-container matColumnDef="customerName">
      <th mat-header-cell *matHeaderCellDef> Customer </th>
      <td mat-cell *matCellDef="let quote"> {{quote.customerName}} </td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let quote"> {{quote.description}} </td>
    </ng-container>

    <!-- Base Price Column -->
    <ng-container matColumnDef="basePrice">
      <th mat-header-cell *matHeaderCellDef> Base Price </th>
      <td mat-cell *matCellDef="let quote"> {{quote.basePrice | currency}} </td>
    </ng-container>

    <!-- Total Price Column -->
    <ng-container matColumnDef="totalPrice">
      <th mat-header-cell *matHeaderCellDef> Total Price </th>
      <td mat-cell *matCellDef="let quote"> 
        {{quote.totalPrice | currency}} 
        <span *ngIf="quote.discount > 0" class="discount-badge">-{{quote.discount}}%</span>
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let quote">
        <mat-chip [ngClass]="quote.status.toLowerCase()">{{quote.status}}</mat-chip>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  
  <div *ngIf="quotes.length === 0" class="empty-state">
    <p>No quotes found.</p>
  </div>
</div>
