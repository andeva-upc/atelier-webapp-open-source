<div class="table-container">
  <table mat-table [dataSource]="quotes" class="mat-elevation-z2" *ngIf="quotes.length > 0">
    
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Quote ID </th>
      <td mat-cell *matCellDef="let quote"> {{quote.id.substring(0, 8)}}... </td>
    </ng-container>

    <!-- Work Order ID Column -->
    <ng-container matColumnDef="workOrderId">
      <th mat-header-cell *matHeaderCellDef> Work Order </th>
      <td mat-cell *matCellDef="let quote"> {{quote.workOrderId.substring(0, 8)}}... </td>
    </ng-container>

    <!-- Subtotal Amount Column -->
    <ng-container matColumnDef="subtotalAmount">
      <th mat-header-cell *matHeaderCellDef> Subtotal </th>
      <td mat-cell *matCellDef="let quote"> {{quote.subtotalAmount | currency}} </td>
    </ng-container>

    <!-- Discount Percentage Column -->
    <ng-container matColumnDef="discountPercentage">
      <th mat-header-cell *matHeaderCellDef> Discount </th>
      <td mat-cell *matCellDef="let quote"> {{quote.discountPercentage}}% </td>
    </ng-container>

    <!-- Total Amount Column -->
    <ng-container matColumnDef="totalAmount">
      <th mat-header-cell *matHeaderCellDef> Total Amount </th>
      <td mat-cell *matCellDef="let quote"> 
        {{quote.totalAmount | currency}} 
        <span *ngIf="quote.discountPercentage > 0" class="discount-badge">-{{quote.discountPercentage}}%</span>
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let quote">
        <mat-chip [ngClass]="quote.status.toLowerCase()">{{quote.status}}</mat-chip>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  
  <div *ngIf="quotes.length === 0" class="empty-state">
    <p>No quotes found.</p>
  </div>
</div>
