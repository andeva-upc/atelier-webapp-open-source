<div class="work-order-form-container">
  <!-- Cabecera -->
   <div class="work-order-form-header">
     <div class="header-left">
       <a class="btn-back" [routerLink]="['/work-orders']">
         <i class="pi pi-arrow-left"></i>
         Back to Orders
       </a>
       <h1 class="page-title">{{ isEditMode() ? 'Editar Work Order' : 'Create Work Order' }}</h1>
     </div>
   </div>

   <div class="form-card">

     <!-- Selector de Cita (Appointment) Solo en Modo Creación -->
     @if (!isEditMode()) {
       <div class="form-group">
         @if (branchId()) {
           <app-appointment-selector
             [branchId]="branchId()!"
             [selectedAppointmentId]="selectedAppointmentId()"
             (appointmentSelected)="onAppointmentSelected($event)"
           ></app-appointment-selector>
         } @else {
           <p>Cargando sucursal...</p>
         }
       </div>
     }

     <!-- Mostrar Cliente y Vehículo Autocompletados -->
     @if (selectedCustomerId() && selectedVehicleId()) {
       <div class="form-row auto-filled-info">
         <div class="form-group flex-1">
           <label class="form-label">Customer</label>
           <div class="read-only-field">
             <i class="pi pi-user mr-2"></i>
             <app-customer-name [customerId]="selectedCustomerId()"></app-customer-name>
           </div>
         </div>
         <div class="form-group flex-1">
           <label class="form-label">Vehicle</label>
           <div class="read-only-field">
             <i class="pi pi-car mr-2"></i>
             <app-vehicle-plate [vehicleId]="selectedVehicleId()"></app-vehicle-plate>
           </div>
         </div>
       </div>
     }

     <!-- Fila para Kilometraje -->
     <div class="form-group">
       <label class="form-label">Current Mileage</label>
       <div class="input-wrapper">
         <i class="pi pi-compass input-icon-mileage"></i>
         <input
           type="number"
           placeholder="current mileage"
           class="form-control mileage-input"
           [ngModel]="currentMileage()"
           (ngModelChange)="currentMileage.set($event)"
         />
       </div>
     </div>

     <!-- Diagnóstico (Diagnosis) -->
     <div class="form-group">
       <label class="form-label">Diagnosis</label>
       <textarea
         placeholder="diagnosis"
         class="form-control textarea-control"
         rows="4"
         [ngModel]="diagnosis()"
         (ngModelChange)="diagnosis.set($event)"
       ></textarea>
     </div>

     <!-- Selector de Estado (Status V) - Solo en Modo Edición (Solo Lectura) -->
     @if (isEditMode()) {
       <div class="form-group">
         <label class="form-label">Status</label>
         <div class="select-wrapper">
           <button
             type="button"
             class="form-control select-trigger"
             style="cursor: not-allowed; opacity: 0.8;"
             disabled
           >
             <span class="trigger-text">
               {{ selectedStatus() === 'IN_PROGRESS' ? 'IN PROGRESS' : selectedStatus() }}
             </span>
           </button>
         </div>
       </div>
     }

     <!-- Botones de Acción -->
     <div class="form-actions">
       <button class="btn btn-primary btn-save" (click)="saveWorkOrder()">
         {{ isEditMode() ? 'Guardar Cambios' : 'Crear Work Order' }}
       </button>
     </div>
   </div>
 </div>
