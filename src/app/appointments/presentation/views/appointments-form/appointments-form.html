<form class="appointment-form" [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
  <label class="form-field form-field-full">
    <span>{{ 'appointments.fields.customer' | translate }} *</span>
    <select formControlName="customerId" (change)="onCustomerChange()">
      <option value="">Select customer</option>

      @for (customer of customers(); track customer.id) {
        <option [value]="customer.id">
          {{ customer.name }}
        </option>
      }
    </select>
  </label>

  <div class="form-grid">
    <label class="form-field">
      <span>{{ 'appointments.fields.phone' | translate }} *</span>
      <input
        type="text"
        formControlName="customerPhone"
        readonly
        [placeholder]="'appointments.placeholders.phone' | translate"
      />
    </label>

    <label class="form-field">
      <span>{{ 'appointments.fields.vehicle' | translate }} *</span>
      <select formControlName="vehicleId" (change)="onVehicleChange()">
        <option value="">Select vehicle</option>

        @for (vehicle of availableVehicles(); track vehicle.id) {
          <option [value]="vehicle.id">
            {{ vehicle.summary }}
          </option>
        }
      </select>
    </label>
  </div>

  <label class="form-field form-field-full">
    <span>{{ 'appointments.fields.service' | translate }} *</span>
    <input
      type="text"
      formControlName="serviceType"
      [placeholder]="'appointments.placeholders.service' | translate"
    />
  </label>

  <div class="form-grid">
    <label class="form-field">
      <span>{{ 'appointments.fields.date' | translate }} *</span>
      <input type="date" formControlName="date" />
    </label>

    <label class="form-field">
      <span>{{ 'appointments.fields.time' | translate }} *</span>
      <input type="time" formControlName="time" />
    </label>
  </div>

  <label class="form-field form-field-full">
    <span>{{ 'appointments.fields.mechanic' | translate }} *</span>
    <input
      type="text"
      formControlName="mechanicName"
      [placeholder]="'appointments.placeholders.mechanic' | translate"
    />
  </label>

  <label class="form-field form-field-full">
    <span>{{ 'appointments.fields.notes' | translate }}</span>
    <textarea
      formControlName="notes"
      [placeholder]="'appointments.placeholders.notes' | translate"
    ></textarea>
  </label>

  @if (mode === 'edit') {
    <label class="form-field form-field-full">
      <span>{{ 'appointments.fields.status' | translate }}</span>
      <select formControlName="status">
        <option value="SCHEDULED">
          {{ 'appointments.status.confirmed' | translate }}
        </option>
        <option value="PENDING_APPROVAL">
          {{ 'appointments.status.pending' | translate }}
        </option>
        <option value="CANCELLED">
          {{ 'appointments.status.cancelled' | translate }}
        </option>
        <option value="COMPLETED">
          {{ 'appointments.status.completed' | translate }}
        </option>
      </select>
    </label>
  }

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">
      {{ 'appointments.actions.cancel' | translate }}
    </button>

    <button type="submit" class="btn-primary" [disabled]="saving">
      {{
        mode === 'edit'
          ? ('appointments.actions.saveChanges' | translate)
          : ('appointments.actions.schedule' | translate)
      }}
    </button>
  </div>
</form>
