<form class="appointment-form" [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
  <label class="form-field form-field-full">
    <span>Cliente *</span>
    <input type="text" formControlName="customerName" placeholder="Nombre del cliente" />
  </label>

  <div class="form-grid">
    <label class="form-field">
      <span>Teléfono *</span>
      <input type="text" formControlName="customerPhone" placeholder="9xx xxx xxx" />
    </label>

    <label class="form-field">
      <span>Vehículo *</span>
      <input type="text" formControlName="vehicleSummary" placeholder="Marca Modelo Placa" />
    </label>
  </div>

  <label class="form-field form-field-full">
    <span>Servicio *</span>
    <input type="text" formControlName="serviceType" placeholder="Tipo de servicio" />
  </label>

  <div class="form-grid">
    <label class="form-field">
      <span>Fecha *</span>
      <input type="date" formControlName="date" />
    </label>

    <label class="form-field">
      <span>Hora *</span>
      <input type="time" formControlName="time" />
    </label>
  </div>

  <label class="form-field form-field-full">
    <span>Mecánico asignado *</span>
    <input type="text" formControlName="mechanicName" placeholder="Nombre del mecánico" />
  </label>

  <label class="form-field form-field-full">
    <span>Observaciones</span>
    <textarea formControlName="notes" placeholder="Notas del cliente (opcional)"></textarea>
  </label>

  @if (mode === 'edit') {
    <label class="form-field form-field-full">
      <span>Estado</span>
      <select formControlName="status">
        <option value="SCHEDULED">Confirmada</option>
        <option value="PENDING_APPROVAL">Pendiente</option>
        <option value="CANCELLED">Cancelada</option>
        <option value="COMPLETED">Completada</option>
      </select>
    </label>
  }

  <div class="form-actions">
  <button type="button" class="btn-secondary" (click)="onCancel()">
    Cancelar
  </button>

  <button type="submit" class="btn-primary">
  {{ mode === 'edit' ? 'Guardar cambios' : 'Agendar cita' }}
  </button>
  </div>
</form>
