<div class="view-container">
  <div class="view-header">
    <div class="header-titles">
      <button class="btn-back" (click)="onCancel()"><i class="pi pi-arrow-left"></i></button>
      <div>
        <h2>{{ 'inventory.batchForm.title' | translate }}</h2>
        <ng-container *ngIf="activeProduct()">
          <p>{{ 'inventory.batchForm.subtitle' | translate }} <strong>{{ activeProduct()!.name }}</strong> (SKU: {{ activeProduct()!.sku }})</p>
        </ng-container>
      </div>
    </div>
  </div>

  <ng-container *ngIf="activeProduct(); else loading">
    <app-batch-form 
      (save)="onSave($event)"
      (cancel)="onCancel()">
    </app-batch-form>
  </ng-container>

  <ng-template #loading>
    <div class="loading-state">
      <i class="fas fa-spinner fa-spin"></i> {{ 'inventory.batchForm.loading' | translate }}
    </div>
  </ng-template>
</div>
