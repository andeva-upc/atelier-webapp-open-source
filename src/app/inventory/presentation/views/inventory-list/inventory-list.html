<div class="inventory-container">
  <div class="inventory-header">
    <div class="header-titles">
      <h1>{{ 'inventory.title' | translate }}</h1>
      <p>{{ 'inventory.subtitle' | translate }}</p>
    </div>
    
    <div class="header-actions">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" [placeholder]="'inventory.searchPlaceholder' | translate">
      </div>
      
      <select [ngModel]="selectedCategory()" (ngModelChange)="selectedCategory.set($event)" class="category-select">
        <option value="">{{ 'inventory.allCategories' | translate }}</option>
        @for (category of categories(); track category) {
          <option [value]="category">{{ category }}</option>
        }
      </select>

      <button class="add-product-btn" (click)="onAddProduct()">
        <i class="fas fa-plus"></i>
        {{ 'inventory.addProduct' | translate }}
      </button>
    </div>
  </div>

  <div class="products-grid" *ngIf="products() && products().length > 0; else emptyState">
    @for (product of products(); track product.id) {
      <app-product-card 
        [product]="product"
        (cardClick)="onProductClick($event)"
        (addBatchClick)="onAddBatch($event)">
      </app-product-card>
    }
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <div class="empty-icon">
        <i class="fas fa-box-open"></i>
      </div>
      <h2>{{ 'inventory.emptyState.title' | translate }}</h2>
      <p>{{ 'inventory.emptyState.subtitle' | translate }}</p>
      <button class="add-product-btn" (click)="onAddProduct()">
        {{ 'inventory.addProduct' | translate }}
      </button>
    </div>
  </ng-template>
</div>
