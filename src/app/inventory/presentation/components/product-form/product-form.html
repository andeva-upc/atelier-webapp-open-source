<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="modern-form">
  
  <div class="form-grid">
    <div class="form-group">
      <label for="name">Nombre del Producto *</label>
      <input id="name" type="text" formControlName="name" placeholder="Ej. Filtro de Aceite Premium" [class.error]="hasError('name')">
      <span class="error-msg" *ngIf="hasError('name')">El nombre es requerido</span>
    </div>

    <div class="form-group">
      <label for="sku">SKU / Código *</label>
      <input id="sku" type="text" formControlName="sku" placeholder="Ej. FLT-001" [class.error]="hasError('sku')">
      <span class="error-msg" *ngIf="hasError('sku')">El SKU es requerido</span>
    </div>

    <div class="form-group">
      <label for="category">Categoría *</label>
      <select id="category" formControlName="category" [class.error]="hasError('category')">
        <option value="">Selecciona una categoría...</option>
        <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
      </select>
      <span class="error-msg" *ngIf="hasError('category')">Seleccione una categoría válida</span>
    </div>

    <div class="form-group" *ngIf="productForm.get('category')?.value === 'OTHER'">
      <label for="customCategory">Especificar Categoría *</label>
      <input id="customCategory" type="text" formControlName="customCategory" placeholder="Ej. Baterías" [class.error]="hasError('customCategory')">
      <span class="error-msg" *ngIf="hasError('customCategory')">Especifique su categoría</span>
    </div>

    <div class="form-group">
      <label for="salePrice">Precio de Venta ($) *</label>
      <input id="salePrice" type="number" step="0.01" formControlName="salePrice" placeholder="0.00" [class.error]="hasError('salePrice')">
      <span class="error-msg" *ngIf="hasError('salePrice')">El precio debe ser un número positivo</span>
    </div>

    <div class="form-group full-width">
      <label for="description">Descripción</label>
      <textarea id="description" formControlName="description" rows="3" placeholder="Detalles del producto..."></textarea>
    </div>

    <div class="form-group">
      <label for="minimumStock">Stock Mínimo de Alerta *</label>
      <input id="minimumStock" type="number" formControlName="minimumStock" placeholder="Ej. 5" [class.error]="hasError('minimumStock')">
      <span class="error-msg" *ngIf="hasError('minimumStock')">Ingrese un número positivo</span>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="productForm.invalid">
      {{ isEditMode ? 'Guardar Cambios' : 'Crear Producto' }}
    </button>
  </div>

</form>
