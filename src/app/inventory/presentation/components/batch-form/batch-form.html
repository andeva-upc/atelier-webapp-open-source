<form [formGroup]="batchForm" (ngSubmit)="onSubmit()" class="modern-form">
  <div class="form-grid">
    <div class="form-group">
      <label for="initialQuantity">Cantidad Inicial *</label>
      <input id="initialQuantity" type="number" formControlName="initialQuantity" placeholder="Ej. 100" [class.error]="hasError('initialQuantity')">
      <span class="error-msg" *ngIf="hasError('initialQuantity')">Ingrese una cantidad mayor a 0</span>
    </div>

    <div class="form-group">
      <label for="acquisitionCost">Costo de Adquisición ($) *</label>
      <input id="acquisitionCost" type="number" step="0.01" formControlName="acquisitionCost" placeholder="0.00" [class.error]="hasError('acquisitionCost')">
      <span class="error-msg" *ngIf="hasError('acquisitionCost')">El costo debe ser mayor o igual a 0</span>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-primary" [disabled]="batchForm.invalid">Agregar Lote</button>
  </div>
</form>
