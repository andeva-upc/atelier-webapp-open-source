
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>{{ 'product-selector.label' | translate }}</mat-label>
      <mat-select [ngModel]="selectedProductId" (ngModelChange)="onSelectionChange($event)" [disabled]="disabled">
        @for (product of inventoryStore.branchProducts(); track product.id) {
          <mat-option [value]="product.id">
            {{ product.name }} ({{ 'product-selector.stock' | translate }}: {{ product.currentStock }})
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
