<mat-toolbar class="tool">
  <div class="toolbar-start">
    <!-- El lado izquierdo para el título de la página u otras opciones -->
  </div>

  <div class="toolbar-end">
    <!-- Botón de Idioma -->
    <div class="toolbar-item language-wrapper">
      <button [matMenuTriggerFor]="langMenu" class="user-button" type="button">
        <i class="pi pi-globe"></i>
        <span class="lang-text">{{ currentLang | uppercase }}</span>
        <i class="pi pi-chevron-down"></i>
      </button>
      <mat-menu #langMenu="matMenu" class="custom-menu">
        <button mat-menu-item (click)="switchLanguage('es')">
          <span class="menu-text">Español</span>
        </button>
        <button mat-menu-item (click)="switchLanguage('en')">
          <span class="menu-text">English</span>
        </button>
      </mat-menu>
    </div>

    <!-- Botón de notificaciones -->
    <div class="toolbar-item notifications-wrapper">
      <button class="notification-button" type="button"
              [matBadge]="hasNotifications() ? notificationCount() : null"
              matBadgeColor="warn"
              [matBadgeHidden]="!hasNotifications()">
        <i class="pi pi-bell"></i>
      </button>
    </div>

    <!-- Menú desplegable del usuario -->
    <div class="toolbar-item user-wrapper">
      <button [matMenuTriggerFor]="userMenu" class="user-button" type="button">
        <div class="user-avatar">{{ userInitials() }}</div>
        <span class="user-name">{{ currentUser().name }}</span>
        <i class="pi pi-chevron-down"></i>
      </button>
      <mat-menu #userMenu="matMenu" class="custom-menu">
        <button mat-menu-item>
          <div class="menu-item-content">
            <i class="pi pi-user menu-icon"></i>
            <span class="menu-text">Perfil</span>
          </div>
        </button>
        <button mat-menu-item>
          <div class="menu-item-content">
            <i class="pi pi-sign-out menu-icon"></i>
            <span class="menu-text">Cerrar sesión</span>
          </div>
        </button>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>
