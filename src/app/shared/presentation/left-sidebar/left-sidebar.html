<aside [class.is-expanded]="isExpanded()">
  <div class="logo-container">
    <button type="button" class="arrow" aria-label="toggle sidebar" (click)="toggleSidebar()">
      <i class="sidebar-toggle-icon" [ngClass]="isExpanded() ? 'pi pi-times' : 'pi pi-bars'"></i>
    </button>
    <p class="logo-text">atelier</p>
  </div>
  <div class="sidebar-divider"></div>
  <nav class="sidenav">
    @for (option of options(); track option.label) {
      <a class="sidenav-nav-item" [routerLink]="option.link" routerLinkActive="active">
        <i [ngClass]="option.icon"></i>
        <span class="sidenav-nav-label">{{ option.label | translate }}</span>
      </a>
    }
  </nav>
</aside>
