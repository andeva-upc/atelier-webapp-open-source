<mat-card class="form-card fade-in">
  <mat-card-header>
    <mat-card-title>Registro de Cliente</mat-card-title>
    <mat-card-subtitle>Ingresa tus datos para completar tu perfil</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="toggle-container">
      <mat-slide-toggle color="primary" [checked]="isCorporate" (change)="toggleCorporate()">
        Soy una empresa
      </mat-slide-toggle>
    </div>

    <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="onboarding-form">
      
      @if (!isCorporate) {
        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombres</mat-label>
            <input matInput formControlName="firstname">
            <mat-error *ngIf="customerForm.get('firstname')?.hasError('required')">Requerido</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Apellidos</mat-label>
            <input matInput formControlName="lastname">
            <mat-error *ngIf="customerForm.get('lastname')?.hasError('required')">Requerido</mat-error>
          </mat-form-field>
        </div>
      } @else {
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Razón Social</mat-label>
          <input matInput formControlName="businessName">
          <mat-error *ngIf="customerForm.get('businessName')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>
      }

      <div class="form-row">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Tipo de Documento</mat-label>
          <mat-select formControlName="documentType">
            <mat-option value="DNI" *ngIf="!isCorporate">DNI</mat-option>
            <mat-option value="CE" *ngIf="!isCorporate">CE</mat-option>
            <mat-option value="PASSPORT" *ngIf="!isCorporate">Pasaporte</mat-option>
            <mat-option value="RUC" *ngIf="isCorporate">RUC</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Número de Documento</mat-label>
          <input matInput formControlName="documentNumber">
          <mat-error *ngIf="customerForm.get('documentNumber')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phone">
        <mat-error *ngIf="customerForm.get('phone')?.hasError('required')">Requerido</mat-error>
      </mat-form-field>

      <div class="action-buttons">
        <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="customerForm.invalid">
          Crear Perfil
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
