<div class="toolbar-item user-wrapper">
  <button [matMenuTriggerFor]="userMenu" class="user-button" type="button">
    <div class="user-avatar">{{ userInitials() }}</div>
    <span class="user-name">{{ userName() || ('profile.loading' | translate) }}</span>
    <i class="pi pi-chevron-down"></i>
  </button>
  <mat-menu #userMenu="matMenu" class="custom-menu">
    <button mat-menu-item>
      <span class="menu-item-content">
        <i class="pi pi-user menu-icon"></i>
        <span class="menu-text">{{ 'profile.profile' | translate }}</span>
      </span>
    </button>
    <!-- Sub-menu de Sede (Sólo Móvil) -->
    <app-core-mobile-branch-menu-item></app-core-mobile-branch-menu-item>

    <!-- Sub-menu de Idioma (Sólo Móvil) -->
    <button mat-menu-item [matMenuTriggerFor]="langSubMenu" class="mobile-only">
      <span class="menu-item-content">
        <i class="pi pi-globe menu-icon"></i>
        <span class="menu-text">{{ 'profile.language' | translate }} {{ currentLang() | uppercase }}</span>
      </span>
    </button>

    <button mat-menu-item (click)="onSignOut()">
      <span class="menu-item-content">
        <i class="pi pi-sign-out menu-icon"></i>
        <span class="menu-text">{{ 'logout' | translate }}</span>
      </span>
    </button>
  </mat-menu>

  <!-- Definición de sub-menus -->

  <mat-menu #langSubMenu="matMenu" class="custom-menu">
    <button mat-menu-item (click)="switchLanguage('es')">
      <span class="menu-text">Español</span>
    </button>
    <button mat-menu-item (click)="switchLanguage('en')">
      <span class="menu-text">English</span>
    </button>
  </mat-menu>
</div>
