<div class="split-layout">
  <!-- Left Side: Form -->
  <div class="form-side">
    <div class="top-bar">
      <app-arrow-back link="https://atelier-website-11848.vercel.app/"></app-arrow-back>
    </div>

    <div class="form-container">
      <h1 class="main-heading">
        Bienvenido a <span class="brand-text">atelier.</span><br/>
        Regístrate para iniciar!
      </h1>
      <p class="subtitle">Ingrese su datos personales para registrarse</p>

      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="auth-form">

        <!-- Email Field -->
        <mat-form-field appearance="outline" class="full-width">
          <input matInput type="email" formControlName="email" placeholder="Email">
          <i class="pi pi-user suffix-icon" matSuffix></i>
          <mat-error *ngIf="emailControl?.hasError('required')">El email es requerido</mat-error>
          <mat-error *ngIf="emailControl?.hasError('email')">Debe ser un email válido</mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="full-width">
          <input matInput type="password" formControlName="password" placeholder="Contraseña">
          <i class="pi pi-lock suffix-icon" matSuffix></i>
          <mat-error *ngIf="passwordControl?.hasError('required')">La contraseña es requerida</mat-error>
          <mat-error *ngIf="passwordControl?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <!-- Terms and Conditions -->
        <div class="terms-container">
          <mat-checkbox formControlName="terms" color="primary">
            Acepto los Términos y Condiciones
          </mat-checkbox>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <button mat-flat-button color="primary" type="submit" class="submit-btn">
            Registrarse
          </button>
          <button mat-stroked-button color="primary" type="button" class="login-link-btn" routerLink="/sign-in">
            Iniciar Sesión
          </button>
        </div>

      </form>

      <!-- Google Sign In -->
      <div class="social-login">
        <p class="social-text">O ingresa con</p>
        <button mat-icon-button class="google-btn" (click)="onGoogleSignIn()" type="button" aria-label="Ingresa con Google">
          <h2 style="font-family: Arimo; font-weight: bold; color: #4b5563; margin: 0;">G</h2>
        </button>
      </div>
    </div>
  </div>

  <!-- Right Side: Illustration -->
  <div class="illustration-side">
    <div class="illustration-container">
      <img src="/assets/images/sign-up-image.jpg" alt="Handshake Collaboration" class="illustration-img" />
    </div>
  </div>
</div>
